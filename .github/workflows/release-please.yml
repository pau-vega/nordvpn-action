name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json

  tag-floating-major:
    needs: [release-please]
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Force-move floating major tag
        shell: bash
        run: |
          NEW_VERSION="$(jq -r '.["actions/nordvpn"]' .release-please-manifest.json)"
          MAJOR="${NEW_VERSION%%.*}"
          FLOATING_TAG="nordvpn-v${MAJOR}"

          git tag -fa "$FLOATING_TAG" -m "Floating major tag for nordvpn v${NEW_VERSION}"
          git push origin --force "$FLOATING_TAG"
          echo "::notice::Moved ${FLOATING_TAG} -> nordvpn v${NEW_VERSION}"
