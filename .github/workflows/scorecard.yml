name: scorecard

on:
  branch_protection_rule:
  schedule:
    # Saturday 03:00 UTC — off-peak, avoids contention with the Monday 08:00 UTC self-test cron.
    - cron: '0 3 * * 6'
  push:
    branches: [main]

permissions: read-all

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Required for uploading the SARIF results to the code-scanning dashboard.
      security-events: write
      # Required for GitHub's OIDC token authentication used by `publish_results`.
      id-token: write
      contents: read
      # Required for retrieving repository metadata such as branch-protection rules.
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          repo_token: ${{ secrets.SCORECARD_TOKEN }}
          # `publish_results` requires `id-token: write` (above) and writes to the
          # public OpenSSF Scorecard dashboard so the badge in README resolves.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning dashboard
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif
