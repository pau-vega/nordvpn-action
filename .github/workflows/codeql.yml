name: codeql

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'action.yml'
      - 'disconnect/**'
      - 'scripts/**'
      - 'vpn/**'
      - '.release-please-manifest.json'
      - '**/CHANGELOG.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'action.yml'
      - 'disconnect/**'
      - 'scripts/**'
      - 'vpn/**'
      - '.release-please-manifest.json'
      - '**/CHANGELOG.md'
  schedule:
    # Tuesday 06:00 UTC — separate from the Saturday Scorecard cron and the Monday self-test cron.
    - cron: '0 6 * * 2'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Required for code-scanning result upload.
      security-events: write
      # `github/codeql-action/init` reads workflow run metadata for the actions language.
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # `actions` is the first-class CodeQL language for analyzing GitHub Actions
        # workflows and `action.yml` files — catches expression-injection /
        # untrusted-input-in-`run:` patterns that actionlint does not detect.
        # No source-language analysis is configured because this repo ships only
        # Bash scripts (not a CodeQL-supported language) and YAML.
        language: [actions]

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: "/language:${{ matrix.language }}"
